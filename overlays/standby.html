    r = Math.max(0, Math.min(r, (x1 - x0) / 2, (y1 - y0) / 2))
    ctx.beginPath()
    ctx.moveTo(x0, y0)
    ctx.lineTo(x1 - r, y0)
    ctx.arcTo(x1, y0, x1, y0 + r, r)
    ctx.lineTo(x1, y1 - r)
    ctx.arcTo(x1, y1, x1 - r, y1, r)
    ctx.lineTo(x0, y1)
    ctx.closePath()
  }
  // Stroke a frame with the bloom the film's frames have.
  function frame(f, colour, width, round = true) {
    const { u } = L
    if (round) framePath(f.x0, f.y0, f.x1, f.y1, f.r)
    else { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(f.x0, f.y0, f.x1 - f.x0, f.y1 - f.y0, f.r) : ctx.rect(f.x0, f.y0, f.x1 - f.x0, f.y1 - f.y0) }
    ctx.strokeStyle = colour
    ctx.lineWidth = width
    glow(colour, 0.9 * u)
    ctx.stroke()
    glow(colour, 0.3 * u)
    ctx.stroke()
    noGlow()
  }
  // A label and a big white station number on one line, sharing `w`.
  function station(label, number, x, y, w, capL, capN, labelColour) {
    const wl = textWidth(label, 1, 0.08), wn = textWidth(number, 1, 0.02)
    const k = Math.min(1, (w - 2 * L.u) / (wl * capL + wn * capN))
    glow(labelColour, 0.35 * L.u)
    text(label, x, y, capL * k, labelColour, 'l', 0.08)
    glow(C.text, 0.4 * L.u)
    text(number, x + w, y + 0.12 * capN * k, capN * k, C.text, 'r', 0.02)
    noGlow()
  }

  function layout(OX, OY) {
    const VW = W - OX, VH = H - OY
    const u = Math.max(7, Math.min(20, Math.min(VW / 64, VH / 56)))
    const pad = 1.2 * u, gap = 1.2 * u
    const x0 = OX + pad, x1 = W - pad, y0 = OY + pad, y1 = H - pad
    const w = x1 - x0
    const top = y0 + 2.8 * u                 // below the header
    const hC = 5.6 * u, yC = y1 - hC         // console row
    const yMB = yC - 1.3 * u                 // bottom of the main block
    const labelH = 2.7 * u
    const xL1 = x0 + 0.57 * w, xR0 = xL1 + gap
    const em = { x0, y0: top, x1: xL1, y1: yMB - labelH, r: 3.2 * u }
    const ringH = 0.45 * (yMB - top)
    const rg = { x0: xR0, y0: top, x1, y1: top + ringH, r: 2.6 * u }
    const sub = { x0: xR0, y0: rg.y1 + gap, x1, y1: yMB - labelH, r: 2.6 * u }
    L = { u, x0, x1, y0, y1, w, top, hC, yC, yMB, labelH, em, rg, sub }

    // EM DISPLAY.
    const ew = em.x1 - em.x0, eh = em.y1 - em.y0, ei = 1.0 * u
    L.emBand = em.y0 + 0.17 * eh
    L.emMid = em.y0 + 0.73 * eh
    L.field = { x0: em.x0 + ei, x1: em.x0 + 0.42 * ew, y0: L.emBand + 0.6 * u, y1: L.emMid - 0.6 * u }
    L.graph = { x0: em.x0 + 0.47 * ew, x1: em.x1 - 1.4 * u, y0: L.emBand + 0.8 * u, y1: L.emBand + 0.5 * (L.emMid - L.emBand) - 0.4 * u }
    L.chart = { x0: L.graph.x0, x1: L.graph.x1, y0: L.graph.y1 + 1.0 * u, y1: L.emMid - 1.6 * u }
    const gw = L.graph.x1 - L.graph.x0
    L.graphLabelW = Math.min(0.3 * gw, 4.5 * u)
    L.barsN = 9
    L.bars = []
    for (let i = 0; i < L.barsN; i++) { const v = 0.35 + rnd() * 0.65; L.bars.push({ v, to: v }) }
    L.graphLabels = [0, 1, 2, 3].map(() => num(5))
    L.band = []
    for (let i = 0; i < 3; i++) L.band.push([num(6), num(4), num(5)])
    L.bandR = [num(4), num(4)]
    L.rows = []
    for (let i = 0; i < 3; i++) L.rows.push([num(3), num(4), num(2)])
    L.big = [num(1), num(3), num(2)]
    L.blob = { phase: rnd() * TAU }

    // The status ring, open at the lower right.
    const gwR = rg.x1 - rg.x0, ghR = rg.y1 - rg.y0
    L.ring = { cx: rg.x0 + 0.37 * gwR, cy: rg.y0 + 0.52 * ghR, R: Math.min(0.4 * ghR, 0.31 * gwR) }
    L.segs = []
    const deg = d => (d - 90) * Math.PI / 180  // clockwise from straight up
    let d = 200
    while (d < 440) {
      const span = 14 + rnd() * 26
      const end = Math.min(455, d + span)
      L.segs.push({ a0: deg(d), a1: deg(end), colour: d < 345 ? C.sky : C.deepgreen, on: rnd() < 0.8, inner: false })
      d = end + 3
    }
    d = 205
    while (d < 450) {
      const span = 30 + rnd() * 50
      const end = Math.min(450, d + span)
      L.segs.push({ a0: deg(d), a1: deg(end), colour: d < 330 ? C.sky : C.deepgreen, on: true, inner: true })
      d = end + 4
    }
    L.ringRows = [0, 1, 2, 3].map(() => num(2 + ((rnd() * 4) | 0)))

    // SUBSPACE ANALYSIS.
    const sw = sub.x1 - sub.x0, sh = sub.y1 - sub.y0
    L.subRuleTop = sub.y0 + 0.9 * u
    L.subLow = sub.y0 + 0.74 * sh
    L.ellipses = []
    const n = 13
    for (let i = 0; i < n; i++) {
      const k = i / (n - 1)
      const rx = Math.min((0.3 - 0.27 * k) * sw, (0.42 - 0.38 * k) * sh)
      L.ellipses.push({ cx: sub.x0 + (0.36 - 0.17 * k) * sw, cy: sub.y0 + (0.47 - 0.18 * k) * sh, rx, ry: rx * 0.56 })
    }
    L.plot = { x0: sub.x0 + 0.7 * sw, x1: sub.x1 - 1.6 * u, y0: L.subRuleTop + 1.4 * u, y1: L.subLow - 0.8 * u }
    L.bearing = 323
    L.mark = 76
    L.trace = num(6)

    // Console row: three panels of pills, then the stardate.
    L.panels = []
    const pw = 0.22 * w
    const colours = [C.green, C.sky, C.text]
    for (let p = 0; p < 3; p++) {
      const px = x0 + p * (pw + 1.0 * u)
      const pills = []
      for (let row = 0; row < 3; row++) for (let col = 0; col < 5; col++) {
        pills.push({ row, col, colour: colours[(row + col + p) % 3], on: rnd() < 0.55 })
      }
      L.panels.push({ x0: px, x1: px + pw, colour: p % 2 ? C.frame : C.deepgreen, pills, nums: [num(3), num(3), num(3)] })
    }
    L.sdX = x0 + 3 * (pw + 1.0 * u) + 0.6 * u
    // The dashboard keeps its theme-sound button in the bottom right corner,
    // so the stardate ends short of it.
    L.sdR = x1 - 3.6 * u
    L.bg = offscreen(paintStatic)
  }

  function paintStatic() {
    const { u, x0, x1, y0, em, rg, sub } = L
    rect(0, 0, W, H, '#000')

    // Header: ship and registry, a rule, a red-orange pill (as on the splash).
    const capT = 1.35 * u, capR = 0.95 * u
    const wT = textWidth(C.ship, 1, 0.06), wR = textWidth(C.registry, 1, 0.06)
    const k = Math.min(1, (L.w - 9 * u) / (wT * capT + wR * capR))
    const base = y0 + 1.4 * u
    glow(C.text, 0.4 * u)
    text(C.ship, x0, base, capT * k, C.strong, 'l', 0.06)
    const rx = x0 + wT * capT * k + 1.2 * u
    glow(C.sky, 0.35 * u)
    text(C.registry, rx, base, capR * k, C.sky, 'l', 0.06)
    const ruleX = rx + wR * capR * k + 1.2 * u
    glow(C.sky, 0.5 * u)
    pill(ruleX, base - 0.55 * u, Math.max(0, x1 - 5.4 * u - ruleX), 0.32 * u, C.sky)
    glow(C.label, 0.5 * u)
    pill(x1 - 4.2 * u, base - 0.9 * u, 4.2 * u, 1.0 * u, C.label)
    noGlow()

    // EM DISPLAY frame, its inner rules, the field grid and the static labels.
    frame(em, C.frame, Math.max(1.5, 0.22 * u))
    glow(C.frame, 0.4 * u)
    ctx.strokeStyle = C.frame
    ctx.lineWidth = Math.max(1, 0.1 * u)
    ctx.beginPath()
    ctx.moveTo(em.x0, L.emBand); ctx.lineTo(em.x1 - 0.6 * u, L.emBand)
    ctx.moveTo(em.x0, L.emMid); ctx.lineTo(em.x1 - 0.2 * u, L.emMid)
    ctx.moveTo(L.field.x1 + 0.9 * u, L.emBand); ctx.lineTo(L.field.x1 + 0.9 * u, L.emMid)
    ctx.moveTo(em.x0 + 0.5 * (em.x1 - em.x0), em.y0); ctx.lineTo(em.x0 + 0.5 * (em.x1 - em.x0), L.emBand)
    ctx.stroke()
    const f = L.field
    ctx.lineWidth = Math.max(1, 0.12 * u)
    ctx.strokeStyle = C.sky
    ctx.beginPath()
    for (const q of [0.12, 0.5, 0.88]) { ctx.moveTo(f.x0 + q * (f.x1 - f.x0), f.y0); ctx.lineTo(f.x0 + q * (f.x1 - f.x0), f.y1) }
    ctx.stroke()
    noGlow()
    ctx.strokeStyle = C.border
    ctx.lineWidth = Math.max(1, 0.12 * u)
    ctx.beginPath()
    for (let y = f.y0; y <= f.y1; y += 0.85 * u) {
      for (let q = 0; q < 3; q++) {
        const a0 = f.x0 + [0.14, 0.52, 0.9][q] * (f.x1 - f.x0) - (q === 2 ? 0.22 : 0) * (f.x1 - f.x0)
        ctx.moveTo(a0 + 0.02 * (f.x1 - f.x0), y); ctx.lineTo(a0 + 0.34 * (f.x1 - f.x0), y)
      }
    }
    ctx.stroke()
    // The bar graph's box and the chart's grid.
    const g = L.graph, c = L.chart
    frame({ x0: g.x0 + L.graphLabelW, y0: g.y0, x1: g.x1, y1: g.y1, r: 0.5 * u }, C.frame, Math.max(1, 0.12 * u), false)
    ctx.strokeStyle = C.border
    ctx.lineWidth = Math.max(1, 0.08 * u)
    ctx.beginPath()
    for (let i = 0; i <= 4; i++) { const y = c.y0 + i * (c.y1 - c.y0) / 4; ctx.moveTo(c.x0, y); ctx.lineTo(c.x1, y) }
    ctx.stroke()
    glow(C.frame, 0.3 * u)
    ctx.strokeStyle = C.frame
    ctx.lineWidth = Math.max(1, 0.12 * u)
    ctx.strokeRect(c.x0, c.y0, c.x1 - c.x0, c.y1 - c.y0)
    noGlow()
    const capE = fit(C.em, 1.0 * u, 0.42 * (em.x1 - em.x0), 0.04)
    glow(C.sky, 0.4 * u)
    text(C.em, em.x1 - 1.6 * u, L.emBand - 0.7 * u, capE, C.sky, 'r', 0.04)
    noGlow()
    station(C.lateral, C.lateralNo, em.x0, L.yMB - 0.45 * u, em.x1 - em.x0, 0.85 * u, 1.75 * u, C.sky)

    // The status ring screen.
    frame(rg, C.frame, Math.max(1.5, 0.2 * u))
    glow(C.deepgreen, 0.4 * u)
    text(C.ringNo, rg.x1 - 1.8 * u, rg.y0 + 0.74 * (rg.y1 - rg.y0), fit(C.ringNo, 1.3 * u, 0.36 * (rg.x1 - rg.x0)), C.deepgreen, 'r', 0.02)
    noGlow()

    // SUBSPACE ANALYSIS: frame, red-orange rules, the plot grid, the labels.
    frame(sub, C.frame, Math.max(1.5, 0.2 * u))
    glow(C.label, 0.4 * u)
    rect(sub.x0 + 0.8 * u, L.subRuleTop, sub.x1 - sub.x0 - 3.2 * u, Math.max(1.5, 0.22 * u), C.label)
    rect(sub.x0 + 0.8 * u, sub.y1 - 1.0 * u, 0.62 * (sub.x1 - sub.x0), Math.max(1.5, 0.22 * u), C.label)
    noGlow()
    ctx.strokeStyle = C.sky
    ctx.lineWidth = Math.max(1, 0.08 * u)
    ctx.beginPath()
    ctx.moveTo(sub.x0, L.subLow); ctx.lineTo(sub.x1 - 0.4 * u, L.subLow)
    ctx.moveTo(L.plot.x0 - 0.8 * u, L.subRuleTop + 0.6 * u); ctx.lineTo(L.plot.x0 - 0.8 * u, L.subLow)
    ctx.stroke()
    const p = L.plot
    ctx.strokeStyle = C.subspace
    ctx.lineWidth = Math.max(1, 0.1 * u)
    ctx.beginPath()
    for (let i = 0; i <= 6; i++) { const y = p.y0 + i * (p.y1 - p.y0) / 6; ctx.moveTo(p.x0, y); ctx.lineTo(p.x1, y) }
    for (let i = 0; i <= 4; i++) { const x = p.x0 + i * (p.x1 - p.x0) / 4; ctx.moveTo(x, p.y0); ctx.lineTo(x, p.y1) }
    ctx.stroke()
    glow(C.cyan, 0.3 * u)
    ctx.strokeStyle = C.cyan
    ctx.lineWidth = Math.max(1, 0.12 * u)
    ctx.beginPath()
    ctx.moveTo(p.x0, p.y1)
    ctx.quadraticCurveTo(p.x0 + 0.35 * (p.x1 - p.x0), p.y0 + 0.1 * (p.y1 - p.y0), p.x1, p.y0)
    ctx.stroke()
    noGlow()
    const capB = fit(C.bearing + ' 000', 0.62 * u, 0.3 * (sub.x1 - sub.x0), 0.05)
    L.capB = capB
    glow(C.text, 0.3 * u)
    text(C.bearing, sub.x0 + 1.2 * u, L.subLow + 2.0 * capB + 0.6 * u, capB, C.text, 'l', 0.05)
    text(C.mark, sub.x0 + 1.2 * u, L.subLow + 4.0 * capB + 0.6 * u, capB, C.text, 'l', 0.05)
    noGlow()
    station(C.subspaceLabel, C.subspaceNo, sub.x0, L.yMB - 0.45 * u, sub.x1 - sub.x0, 0.85 * u, 1.75 * u, C.label)

    // Console row frames and the stardate.
    for (const pn of L.panels) frame({ x0: pn.x0, y0: L.yC, x1: pn.x1, y1: L.yC + L.hC, r: 0.8 * u }, pn.colour, Math.max(1.2, 0.15 * u), false)
    const sdW = L.sdR - L.sdX
    const capSL = fit(C.stardateLabel, 0.8 * u, sdW, 0.08)
    glow(C.label, 0.35 * u)
    text(C.stardateLabel, L.sdR, L.yC + 1.2 * u, capSL, C.label, 'r', 0.08)
    glow(C.text, 0.45 * u)
    text(C.stardate, L.sdR, L.yC + L.hC - 0.6 * u, fit(C.stardate, 2.0 * u, sdW, 0.02), C.text, 'r', 0.02)
    noGlow()
  }

  function draw(t) {
    const { u, em, rg, sub } = L
    noGlow()
    ctx.drawImage(L.bg, 0, 0, W, H)

    // EM DISPLAY: band numbers, the field's glowing return, bars, two traces, rows.
    const ew = em.x1 - em.x0
    const capN = 0.5 * u
    glow(C.text, 0.25 * u)
    L.band.forEach((row, i) => {
      const y = em.y0 + 1.6 * u + i * 1.15 * u
      text(row[0], em.x0 + 1.2 * u, y, capN, C.text)
      text(row[1], em.x0 + 0.2 * ew, y, capN, C.text)
      text(row[2], em.x0 + 0.32 * ew, y, capN, C.sky)
    })
    L.bandR.forEach((v, i) => text(v, em.x0 + 0.53 * ew, em.y0 + 1.6 * u + i * 1.15 * u, capN, C.text))
    const f = L.field
    const by = f.y0 + (0.5 + 0.32 * Math.sin(t * 0.7 + L.blob.phase)) * (f.y1 - f.y0)
    const bx = f.x0 + (0.5 + 0.08 * Math.sin(t * 1.3)) * (f.x1 - f.x0)
    const br = 0.32 * (f.x1 - f.x0)
    noGlow()
    const rad = ctx.createRadialGradient(bx, by, 0, bx, by, br)
    rad.addColorStop(0, C.strong)
    rad.addColorStop(0.25, C.cyan)
    rad.addColorStop(0.6, 'rgba(0,0,0,0)')
    ctx.fillStyle = rad
    ctx.save()
    ctx.beginPath(); ctx.rect(f.x0, f.y0, f.x1 - f.x0, f.y1 - f.y0); ctx.clip()
    ctx.globalAlpha = 0.85
    // The return is drawn as a lattice of dots, as the film's grid of lights.
    const step = 0.7 * u
    for (let y = f.y0 + step / 2; y < f.y1; y += step) for (let x = f.x0 + step / 2; x < f.x1; x += step) {
      const dd = Math.hypot(x - bx, y - by) / br
      if (dd < 0.6) { ctx.fillRect(x - 0.24 * u, y - 0.24 * u, 0.48 * u, 0.48 * u) }
    }
    ctx.restore()
    ctx.globalAlpha = 1
    const g = L.graph
    const gx0 = g.x0 + L.graphLabelW + 0.6 * u, gw = g.x1 - 0.6 * u - gx0
    const bw = gw / L.barsN
    glow(C.bars, 0.35 * u)
    L.bars.forEach((b, i) => {
      const h = (g.y1 - g.y0 - 1.2 * u) * b.v
      rect(gx0 + i * bw + 0.12 * bw, g.y1 - 0.6 * u - h, 0.76 * bw, h, C.bars)
    })
    glow(C.text, 0.25 * u)
    L.graphLabels.forEach((v, i) => text(v, g.x0, g.y0 + 1.2 * u + i * ((g.y1 - g.y0 - 1.2 * u) / 4), capN, C.text))
    const c = L.chart
    for (const [colour, f1, f2, ph] of [[C.sky, 2.1, 5.3, 0], [C.label, 1.6, 3.7, 2.0]]) {
      glow(colour, 0.4 * u)
      ctx.strokeStyle = colour
      ctx.lineWidth = Math.max(1.2, 0.16 * u)
      ctx.beginPath()
      for (let i = 0; i <= 60; i++) {
        const q = i / 60
        const y = c.y0 + (c.y1 - c.y0) * (0.5 + 0.28 * Math.sin(q * f1 * Math.PI + t * 0.9 + ph) + 0.1 * Math.sin(q * f2 * Math.PI - t * 1.7))
        i ? ctx.lineTo(c.x0 + q * (c.x1 - c.x0), y) : ctx.moveTo(c.x0, y)
      }
      ctx.stroke()
    }
    glow(C.text, 0.25 * u)
    L.rows.forEach((row, i) => {
      const y = L.emMid + 1.5 * u + i * 1.1 * u
      if (y > em.y1 - 0.6 * u) return
      text(row[0], em.x0 + 1.2 * u, y, capN, C.sky)
      text(row[1], em.x0 + 0.14 * ew, y, capN, C.text)
      text(row[2], em.x0 + 0.27 * ew, y, capN, C.text)
    })
    const capBig = Math.min(1.05 * u, 0.3 * (em.y1 - L.emMid))
    glow(C.text, 0.35 * u)
    text(L.big.join(' '), em.x0 + 0.72 * ew, L.emMid + 0.75 * (em.y1 - L.emMid), capBig, C.text, 'r', 0.04)

    // The status ring.
    const { cx, cy, R } = L.ring
    for (const s of L.segs) {
      const r0 = s.inner ? 0.56 * R : 0.78 * R, r1 = s.inner ? 0.66 * R : R
      glow(s.colour, 0.45 * u)
      ctx.globalAlpha = s.on ? 1 : 0.25
      ctx.fillStyle = s.colour
      ctx.beginPath()
      ctx.arc(cx, cy, r1, s.a0, s.a1)
      ctx.arc(cx, cy, r0, s.a1, s.a0, true)
      ctx.closePath()
      ctx.fill()
    }
    ctx.globalAlpha = 1
    glow(C.text, 0.25 * u)
    const rw = rg.x1 - rg.x0
    L.ringRows.forEach((v, i) => text(v, rg.x1 - 1.8 * u, rg.y0 + 0.74 * (rg.y1 - rg.y0) + (1.2 + i * 1.0) * u, 0.48 * u, i % 2 ? C.sky : C.green, 'r'))

    // SUBSPACE ANALYSIS: the ellipses, a ripple running inward, the trajectory.
    const ripple = (t * 0.6) % 1
    L.ellipses.forEach((e, i) => {
      const k = i / (L.ellipses.length - 1)
      const hot = Math.abs(k - ripple) < 0.06
      glow(hot ? C.cyan : C.subspace, (hot ? 0.6 : 0.35) * u)
      ctx.strokeStyle = hot ? C.cyan : C.subspace
      ctx.lineWidth = Math.max(1, 0.13 * u)
      ctx.beginPath()
      ctx.ellipse(e.cx, e.cy, Math.max(1, e.rx), Math.max(1, e.ry), -0.42, 0, TAU)
      ctx.stroke()
    })
    const core = L.ellipses[L.ellipses.length - 1]
    glow(C.label, 0.5 * u)
    ctx.fillStyle = C.label
    ctx.beginPath(); ctx.arc(core.cx, core.cy, Math.max(1.5, 0.35 * u), 0, TAU); ctx.fill()
    const sw = sub.x1 - sub.x0
    const p0 = [sub.x0 + 0.34 * sw, L.subLow - 0.2 * u], pc = [sub.x0 + 0.38 * sw, L.subRuleTop - 3 * u], p1 = [sub.x0 + 0.66 * sw, L.subRuleTop + 3.5 * u]
    glow(C.cyan, 0.4 * u)
    ctx.strokeStyle = C.cyan
    ctx.lineWidth = Math.max(1, 0.14 * u)
    ctx.beginPath(); ctx.moveTo(...p0); ctx.quadraticCurveTo(...pc, ...p1); ctx.stroke()
    const q = (t * 0.12) % 1, mq = 1 - q
    const dot = [mq * mq * p0[0] + 2 * mq * q * pc[0] + q * q * p1[0], mq * mq * p0[1] + 2 * mq * q * pc[1] + q * q * p1[1]]
    glow(C.text, 0.5 * u)
    ctx.fillStyle = C.strong
    ctx.beginPath(); ctx.arc(dot[0], dot[1], Math.max(1.5, 0.3 * u), 0, TAU); ctx.fill()
    text(L.trace, dot[0] + 0.8 * u, dot[1] + 1.4 * u, 0.5 * u, C.text)
    const vx = sub.x0 + 1.2 * u + textWidth(C.bearing + ' ', L.capB, 0.05)
    text(String(L.bearing).padStart(3, '0'), vx, L.subLow + 2.0 * L.capB + 0.6 * u, L.capB, C.text, 'l', 0.05)
    text(String(L.mark).padStart(3, '0'), vx, L.subLow + 4.0 * L.capB + 0.6 * u, L.capB, C.text, 'l', 0.05)

    // Console row pills and numbers.
    const pillH = 0.78 * u
    for (const pn of L.panels) {
      const inner = pn.x1 - pn.x0 - 1.4 * u
      const nx = pn.x0 + 0.8 * u
      glow(C.green, 0.25 * u)
      pn.nums.forEach((v, i) => text(v, nx, L.yC + 1.5 * u + i * 1.5 * u, 0.48 * u, C.green))
      const px0 = nx + textWidth('000', 0.48 * u) + 0.8 * u
      const pw = (pn.x0 + 0.7 * u + inner - px0) / 5
      for (const pl of pn.pills) {
        glow(pl.colour, (pl.on ? 0.45 : 0) * u)
        ctx.globalAlpha = pl.on ? 1 : 0.2
        pill(px0 + pl.col * pw + 0.12 * pw, L.yC + 0.85 * u + pl.row * 1.5 * u, 0.76 * pw, pillH, pl.colour)
      }
      ctx.globalAlpha = 1
    }
    noGlow()
  }

  function tick(dt) {
    const p = Math.min(1, dt * 10)
    for (const b of L.bars) {
      if (Math.random() < 0.1 * p) b.to = 0.2 + Math.random() * 0.8
      b.v += (b.to - b.v) * Math.min(1, dt * 5)
    }
    const fresh = n => String((Math.random() * 10 ** n) | 0).padStart(n, '0')
    const swap = (arr, n) => { arr[(Math.random() * arr.length) | 0] = fresh(n) }
    if (Math.random() < 0.6 * p) { const r = L.band[(Math.random() * 3) | 0], i = (Math.random() * 3) | 0; r[i] = fresh([6, 4, 5][i]) }
    if (Math.random() < 0.4 * p) swap(L.bandR, 4)
    if (Math.random() < 0.5 * p) { const r = L.rows[(Math.random() * 3) | 0]; r[1] = String((Math.random() * 1e4) | 0).padStart(4, '0') }
    if (Math.random() < 0.2 * p) L.big[(Math.random() * 3) | 0] = String((Math.random() * 1000) | 0)
    if (Math.random() < 0.3 * p) swap(L.graphLabels, 5)
    if (Math.random() < 0.3 * p) swap(L.ringRows, 4)
    for (const s of L.segs) if (!s.inner && Math.random() < 0.04 * p) s.on = !s.on
    if (Math.random() < 0.1 * p) L.bearing = (L.bearing + (Math.random() < 0.5 ? 359 : 1)) % 360
    if (Math.random() < 0.08 * p) L.mark = (L.mark + (Math.random() < 0.5 ? 359 : 1)) % 360
    if (Math.random() < 0.5 * p) L.trace = String(100000 + ((Math.random() * 900000) | 0))
    for (const pn of L.panels) {
      if (Math.random() < 0.35 * p) { const pl = pn.pills[(Math.random() * pn.pills.length) | 0]; pl.on = !pl.on }
      if (Math.random() < 0.15 * p) swap(pn.nums, 3)
    }
  }
  // ── end of scene ──

  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1)
    W = Math.max(1, window.innerWidth)
    H = Math.max(1, window.innerHeight)
    canvas.width = Math.round(W * DPR)
    canvas.height = Math.round(H * DPR)
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0)
    seed = SEED
    // The dashboard paints its nav, session list and chat header above
    // overlays, so the scene is laid out in the area they leave visible.
    layout(W >= 1100 ? 520 : W >= 768 ? 250 : 0, W >= 768 ? 96 : 56)
  }

  loadImage(ATLAS.src).then(img => {
    ATLAS.img = img
    resize()
    window.addEventListener('resize', () => { resize(); draw(0) })
    draw(0)
    canvas.classList.add('on')
    const shownAt = performance.now()
    let raf = 0, stopped = false, last = shownAt, acc = 0
    const stop = () => { stopped = true; cancelAnimationFrame(raf) }
    const dismiss = () => {
      if (stopped) return
      stop()
      try { parent.postMessage({ type: 'theme:visibility', visible: false }, '*') } catch {}
    }
    // A browser can fire a synthetic mousemove when the frame appears under a
    // still pointer, so movement counts only after 1.5 s and beyond 8 px.
    let origin = null
    window.addEventListener('pointermove', e => {
      if (performance.now() - shownAt < 1500) return
      if (!origin) { origin = [e.clientX, e.clientY]; return }
      if (Math.hypot(e.clientX - origin[0], e.clientY - origin[1]) > 8) dismiss()
    })
    window.addEventListener('pointerdown', e => { e.preventDefault(); dismiss() })
    window.addEventListener('wheel', dismiss, { passive: true })
    window.addEventListener('keydown', dismiss)
    if (reduced) return
    const STEP = 0.1, SLEEP_AT = 30 * 60
    function frame(ts) {
      if (stopped) return
      acc += Math.min(0.5, (ts - last) / 1000)
      last = ts
      if (acc >= STEP) {
        tick(acc)
        acc = 0
        draw((ts - shownAt) / 1000)
        if ((ts - shownAt) / 1000 > SLEEP_AT && canvas.classList.contains('on')) {
          canvas.style.transition = 'opacity 3s linear'
          canvas.classList.remove('on')
          setTimeout(stop, 3200)
        }
      }
      raf = requestAnimationFrame(frame)
    }
    raf = requestAnimationFrame(frame)
  })
})()
</script>
</body>
</html>
